<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add or Edit a Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: black;
            color: white;
            padding: 10px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }

        .container {
            margin: 20px auto;
            max-width: 800px;
        }

        .form-group label {
            font-weight: bold;
        }

        .form-control {
            margin-bottom: 15px;
        }

        .invalid-feedback {
            display: none;
            color: red;
        }

        .is-invalid + .invalid-feedback {
            display: block;
        }

        .btn-cancel {
            background-color: #dc3545;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #c82333;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center">Add or Edit a Book</h2>
        <form method="POST" action="/add" enctype="multipart/form-data">
            <!-- ISBN Field -->
            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" class="form-control" placeholder="Enter ISBN" required>
                <div class="invalid-feedback">ISBN is required.</div>
                <button type="button" id="fetchDetails" class="btn btn-secondary mt-2">Fetch Details</button>
            </div>

            <!-- Book Title -->
            <div class="form-group">
                <label for="bookTitle">Book Title</label>
                <input type="text" id="bookTitle" name="bookTitle" class="form-control" placeholder="Enter book title" required>
                <div class="invalid-feedback">Book title is required.</div>
            </div>

            <!-- Price -->
            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" id="price" name="price" class="form-control" placeholder="Enter price" value="0.00" step="0.01" min="0" required>
                <div class="invalid-feedback">Price must be a valid number greater than or equal to 0.</div>
            </div>

            <!-- Synopsis -->
            <div class="form-group">
                <label for="synopsis">Synopsis</label>
                <textarea id="synopsis" name="synopsis" class="form-control" placeholder="Enter synopsis"></textarea>
            </div>

            <!-- Current Stock -->
            <div class="form-group">
                <label for="currentStock">Current Stock</label>
                <input type="number" id="currentStock" name="currentStock" class="form-control" value="10" min="0" required>
                <div class="invalid-feedback">Current stock is required.</div>
            </div>

            <!-- Alert Stock -->
            <div class="form-group">
                <label for="alertStock">Alert When Stock Below</label>
                <input type="number" id="alertStock" name="alertStock" class="form-control" value="3" min="0" required>
                <div class="invalid-feedback">Alert stock is required.</div>
            </div>

            <!-- Eco-Friendly Checkbox -->
            <div class="form-group">
                <label for="ecoFriendly">Eco-Friendly</label>
                <input type="checkbox" id="ecoFriendly" name="ecoFriendly" class="form-check-input">
            </div>

            <!-- Book Category Dropdown -->
            <div class="form-group">
                <label for="category">Book Category</label>
                <select id="category" name="category" class="form-control" required>
                    <option value="">Select a category</option>
                    <option value="Physical">Physical Book</option>
                    <option value="E-Book">E-Book</option>
                    <option value="Magazine">Magazine</option>
                </select>
                <div class="invalid-feedback">Category is required.</div>
            </div>

            <!-- Book Image Upload -->
            <div class="form-group">
                <label for="image">Book Image</label>
                <input type="file" id="imageInput" name="image" class="form-control">
            </div>

            <!-- Submit and Cancel Buttons -->
            <button type="submit" class="btn btn-primary w-100 mb-2">Confirm Changes</button>
            <a href="{{ url_for('catalog_admin') }}" class="btn btn-cancel w-100">Cancel</a>
        </form>
    </div>

    <script>
        // Validate price field to ensure it only accepts numbers
        document.getElementById('price').addEventListener('input', (event) => {
            const priceField = event.target;
            const value = priceField.value;

            if (isNaN(value) || value.trim() === "" || Number(value) < 0) {
                priceField.classList.add('is-invalid');
            } else {
                priceField.classList.remove('is-invalid');
            }
        });

        // Fetch book details by ISBN
        document.getElementById('fetchDetails').addEventListener('click', async () => {
            const isbn = document.getElementById('isbn').value.trim();

            if (!isbn) {
                alert('Please enter an ISBN.');
                return;
            }

            try {
                const response = await fetch('/fetch_isbn', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ isbn }),
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch details.');
                }

                const data = await response.json();

                if (data.error) {
                    alert(data.error);
                    return;
                }

                document.getElementById('bookTitle').value = data.title || '';
                document.getElementById('synopsis').value = data.synopsis || '';
            } catch (error) {
                console.error(error);
                alert('Error fetching book details.');
            }
        });
    </script>
</body>
</html>
