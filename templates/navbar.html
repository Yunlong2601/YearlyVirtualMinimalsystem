<!-- templates/navbar.html -->
<head>
     <link rel="stylesheet" href="static/styles.css">
<style>    
    .navbar {
    background-color: black;
    color: white;
    padding: 10px;
}

.navbar a {
    color: white !important;
    text-decoration: none;
    margin-right: 15px;
}

.navbar a:hover {
    color: #f8f9fa !important;
    text-decoration: underline;
}</style>
</head>

<nav class="navbar">
    <ul>
        <li><a href="{{ url_for('home') }}">Home</a></li>
        <li><a href="{{ url_for('user_catalog') }}">Catalog</a></li>
        <li><a href="/rewards">Rewards</a></li>
        <li><a href="{{ url_for('profile') }}">Profile</a></li>
        <li><a href="{{ url_for('shopping_cart', user_id=session.get('user_id')) }}">Shopping Cart</a></li>

        {% if session.get('role') == "admin" %}
            <li><a href="{{ url_for('admin_dashboard') }}">Admin Dashboard</a></li>
            <li><a href="{{ url_for('catalog_admin') }}">Manage Books</a></li>
            <li><a href="{{ url_for('view_database') }}">Manage Users</a></li>
        <li><a href="/rewards">Rewards Admin</a></li>
        {% endif %}

    
            {% if session.get('user_id') %}
                <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}">Login</a>
            {% endif %}
        </div>
    </ul>
</nav>
