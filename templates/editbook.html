<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        .book-image {
            text-align: center;
            margin-bottom: 20px;
        }
        .book-image img {
            max-width: 200px;
            height: auto;
            border-radius: 5px;
        }
        .btn-danger {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center">Edit Book</h2>
        
        <!-- Main Form for Editing Book -->
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group mb-3">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" class="form-control" value="{{ book.isbn }}" readonly>
            </div>
            <div class="form-group mb-3">
                <label for="bookTitle">Book Title</label>
                <input type="text" id="bookTitle" name="bookTitle" class="form-control" value="{{ book.title }}">
            </div>
            <div class="form-group mb-3">
                <label for="price">Price</label>
                <input type="number" id="price" name="price" class="form-control" value="{{ book.price }}" step="0.01" min="0" required>
            </div>
            <div class="form-group mb-3">
                <label for="synopsis">Synopsis</label>
                <textarea id="synopsis" name="synopsis" class="form-control" rows="4">{{ book.synopsis }}</textarea>
            </div>
            <div class="form-group mb-3">
                <label for="currentStock">Current Stock</label>
                <input type="number" id="currentStock" name="currentStock" class="form-control" value="{{ book.stock }}" min="0" required>
            </div>
            <div class="form-group mb-3">
                <label for="alertStock">Alert When Stock Below</label>
                <input type="number" id="alertStock" name="alertStock" class="form-control" value="{{ book.alert_stock }}" min="0" required>
            </div>
            <div class="form-group mb-3">
                <label for="ecoFriendly">Eco-Friendly</label>
                <input type="checkbox" id="ecoFriendly" name="ecoFriendly" class="form-check-input" {% if book.eco_friendly %}checked{% endif %}>
            </div>

            <!-- New Category Dropdown -->
            <div class="form-group mb-3">
                <label for="category">Book Category</label>
                <select id="category" name="category" class="form-control" required>
                    <option value="">Select a category</option>
                    <option value="Physical" {% if book.category == 'Physical' %}selected{% endif %}>Physical Book</option>
                    <option value="E-Book" {% if book.category == 'E-Book' %}selected{% endif %}>E-Book</option>
                    <option value="Magazine" {% if book.category == 'Magazine' %}selected{% endif %}>Magazine</option>
                </select>
            </div>

            <div class="form-group mb-3">
                <label for="imageInput">Current Book Image</label>
                <div class="book-image">
                    <img src="{{ url_for('static', filename='images/' + book.image) }}" alt="Book Image">
                </div>
                <input type="file" id="imageInput" name="image" class="form-control">
            </div>

            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
            </div>
        </form>
        
        <!-- Separate Form for Deleting Book -->
        <form method="POST" action="{{ url_for('delete_book', isbn=book.isbn) }}">
            <button type="submit" class="btn btn-danger w-100">Delete Book</button>
        </form>
    </div>
</body>
</html>
