    <h1 class="form-title">Update User</h1>

    <form method="POST" class="styled-form">
        <!-- Name Input -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="1" required>

        <!-- Email Input -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="1@gmail.com" required>

        <!-- Role Selector -->
        <label for="role">Role:</label>
        <select id="role" name="role" required>
            <option value="user" >User</option>
            <option value="admin" selected>Admin</option>
        </select>

        <!-- Points Input -->
        <label for="points">Points:</label>
        <input type="number" id="points" name="points" value="0" required>

        <!-- Submit Button -->
        <button type="submit" class="btn-primary">Update</button>
    </form>
