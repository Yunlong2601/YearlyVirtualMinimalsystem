<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.title }} - Book Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: black;
            color: white;
            padding: 10px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }

        .book-details-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            gap: 40px;
        }

        .book-image img {
            width: 300px;
            height: auto;
            border-radius: 8px;
        }

        .book-info {
            max-width: 500px;
        }

        .book-info h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .book-info p {
            margin-bottom: 10px;
        }

        .stock-info {
            font-size: 1rem;
            color: #007bff;
            margin-bottom: 10px;
        }

        .stock-info.low-stock {
            color: red;
        }

        .btn-back {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    {% include 'navbar.html' %}

    <!-- Book Details Section -->
    <div class="book-details-container">
        <!-- Book Image -->
        <div class="book-image">
            <img src="{{ url_for('static', filename='images/' + book.image) }}" alt="{{ book.title }}">
        </div>

        <!-- Book Information -->
        <div class="book-info">
            <h2>{{ book.title }}</h2>
            <p><strong>Category:</strong> {{ book.category }}</p>
            <p><strong>Price:</strong> ${{ book.price }}</p>
            
            <div class="stock-info {% if book.stock < book.alert_stock %}low-stock{% endif %}">
                <strong>Stock:</strong> {{ book.stock }} available
            </div>

            <p><strong>Eco-Friendly:</strong> {% if book.eco_friendly %}✔ Yes{% else %}❌ No{% endif %}</p>
            <p><strong>Synopsis:</strong></p>
            <p>{{ book.synopsis }}</p>

            <!-- Add to Cart Button -->
            <form method="POST" action="{{ url_for('add_to_cart', isbn=book.isbn) }}">
                <button type="submit" class="btn btn-success">Add to Cart</button>
            </form>

            <!-- Back to Catalog Button -->
            <a href="{{ url_for('user_catalog') }}" class="btn btn-secondary btn-back">Back to Catalogue</a>
        </div>
    </div>

</body>
</html>
